# GetWink production reverse proxy.
# Canonical host is https://www.getwink.app; the apex 301-redirects to www.
# TLS certificates are issued by Let's Encrypt (certbot certonly) covering both
# getwink.app and www.getwink.app in a single lineage named after the first -d
# (getwink.app). Install to /etc/nginx/sites-available/getwink.conf and symlink
# into sites-enabled.

upstream getwink_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# --- HTTP: ACME challenge + redirect everything to canonical https ---
server {
    listen 80;
    listen [::]:80;
    server_name getwink.app www.getwink.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.getwink.app$request_uri;
    }
}

# --- Apex HTTPS: 301 to canonical www ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name getwink.app;

    ssl_certificate     /etc/letsencrypt/live/getwink.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getwink.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout 1d;
    ssl_session_cache shared:GetWinkSSL:10m;
    ssl_session_tickets off;

    return 301 https://www.getwink.app$request_uri;
}

# --- Canonical www HTTPS ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.getwink.app;

    ssl_certificate     /etc/letsencrypt/live/getwink.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getwink.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout 1d;
    ssl_session_cache shared:GetWinkSSL:10m;
    ssl_session_tickets off;

    # Security headers migrated from vercel.json.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 15m;

    # Signed beta APK served from disk with the correct MIME type + attachment.
    location = /download/beta.apk {
        alias /srv/getwink/download/beta.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="getwink-beta.apk"' always;
        add_header Cache-Control "public, max-age=300" always;
    }

    location / {
        proxy_pass http://getwink_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
