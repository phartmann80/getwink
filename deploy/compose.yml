# GetWink web runtime on the self-hosted server.
# Lives at /srv/getwink/compose.yml. The app listens only on loopback; the
# host-managed nginx terminates TLS and reverse-proxies to it.
#
# GETWINK_IMAGE pins the exact image tag (git SHA) for deploys and rollbacks;
# it defaults to :latest. Set it in /etc/getwink/deploy.env.
services:
  web:
    image: ${GETWINK_IMAGE:-ghcr.io/phartmann80/getwink:latest}
    container_name: getwink-web
    restart: unless-stopped
    env_file:
      # Server-only secrets (chmod 600, never in git). See getwink.env.example.
      - /etc/getwink/getwink.env
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
