name: Deploy (self-hosted)

# Ships the web app to our own server on merge to main.
# This is the only active deploy target. Vercel is left dormant (parked), not a deploy target.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/phartmann80/getwink

jobs:
  # Strict gates: both must pass BEFORE the image is built.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint

  build-and-push:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute image tags
        id: meta
        run: echo "image_ref=${IMAGE}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          # NEXT_PUBLIC_* are public build-time values (inlined into the client
          # bundle). No server secrets are passed as build args.
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_ANDROID_APK_URL=${{ vars.NEXT_PUBLIC_ANDROID_APK_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Ship compose file
        run: |
          scp -i ~/.ssh/id_deploy deploy/compose.yml \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/srv/getwink/compose.yml"
      - name: Pull + restart pinned image
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "GETWINK_IMAGE='${{ needs.build-and-push.outputs.image_ref }}' \
             docker compose -f /srv/getwink/compose.yml pull && \
             GETWINK_IMAGE='${{ needs.build-and-push.outputs.image_ref }}' \
             docker compose -f /srv/getwink/compose.yml up -d --remove-orphans"
      - name: Health gate (fails the deploy if not 200)
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /tmp/health.json -w "%{http_code}" https://www.getwink.app/api/health || true)
            if [ "$code" = "200" ] && grep -q '"ok":true' /tmp/health.json; then
              echo "Health OK: $(cat /tmp/health.json)"; exit 0
            fi
            echo "Attempt $i: HTTP $code; retrying in 6s"; sleep 6
          done
          echo "Health gate failed after deploy"; exit 1

      - name: Prune old images (keep the last 3 on the server)
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" '
            docker images "ghcr.io/phartmann80/getwink" --format "{{.CreatedAt}}\t{{.ID}}" \
              | sort -r | awk "!seen[\$NF]++{print \$NF}" | tail -n +4 \
              | xargs -r docker rmi 2>/dev/null || true
            echo "Retained images:"; docker images "ghcr.io/phartmann80/getwink" --format "  {{.Repository}}:{{.Tag}} ({{.ID}})"
          '
